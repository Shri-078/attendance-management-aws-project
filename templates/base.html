<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-wrap">
        <header class="topbar">
            <h1>
                <a href="{{ url_for('dashboard_page') }}" style="color: inherit; text-decoration: none;">Attendance Management</a>
            </h1>

            {% if session.get('user_id') %}
            <nav class="nav-links">
                <a href="{{ url_for('report_page') }}">Report</a>
                <a href="{{ url_for('add_student_page') }}">Add Student</a>
                <a href="{{ url_for('mark_attendance_page') }}">Attendance</a>
                <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
            </nav>
            {% endif %}
        </header>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
            <section class="flash-box">
                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </section>
            {% endif %}
        {% endwith %}

        <main class="content-box">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
